name: Publish to AWS S3

on:
  workflow_run:
    workflows: ["Build Wheel Package"]
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      s3-path:
        description: 'S3 path to upload wheel (e.g., s3://my-bucket/libs/)'
        required: false
        default: 's3://my-bucket/libs/'

permissions:
  id-token: write
  contents: read

jobs:
  publish-to-s3:
    name: Upload wheel to AWS S3
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download artifacts from build workflow
      if: github.event_name != 'workflow_dispatch'
      uses: actions/github-script@v7
      with:
        script: |
          let allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
             owner: context.repo.owner,
             repo: context.repo.repo,
             run_id: context.payload.workflow_run.id,
          });
          let matchArtifact = allArtifacts.data.artifacts.filter((artifact) => {
            return artifact.name.includes('wheel')
          })[0];
          let download = await github.rest.actions.downloadArtifact({
             owner: context.repo.owner,
             repo: context.repo.repo,
             artifact_id: matchArtifact.id,
             archive_format: 'zip',
          });
          let fs = require('fs');
          fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/artifact.zip`, Buffer.from(download.data));

    - name: Unzip artifacts
      if: github.event_name != 'workflow_dispatch'
      run: |
        unzip -q artifact.zip
        find . -name "*.whl" -type f | head -20

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        aws-region: us-east-1
      continue-on-error: true

    - name: Upload to S3 (if AWS credentials configured)
      if: steps.aws-creds.outcome == 'success'
      env:
        S3_BUCKET_PATH: ${{ github.event.inputs.s3-path || 's3://my-bucket/pydatashred/' }}
      run: |
        echo "Uploading wheels to S3..."
        find . -name "*.whl" -type f -exec aws s3 cp {} $S3_BUCKET_PATH \;
        echo "✓ Upload complete"
        echo ""
        echo "S3 Path: $S3_BUCKET_PATH"
        aws s3 ls $S3_BUCKET_PATH || echo "Note: Could not list S3 path. Check permissions."

    - name: Upload without AWS (for local/GitHub Enterprise)
      if: steps.aws-creds.outcome != 'success'
      run: |
        echo "⚠️  AWS credentials not configured"
        echo ""
        echo "To enable S3 upload:"
        echo "1. Add 'AWS_ROLE_TO_ASSUME' secret with your AWS role ARN"
        echo "2. Configure OpenID Connect (OIDC) for GitHub→AWS"
        echo "3. Or use AWS Access Keys as secrets"
        echo ""
        echo "For now, wheel files are available as GitHub artifacts"
        find . -name "*.whl" -type f -exec ls -lh {} \;

  publish-to-github-release:
    name: Publish to GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Build wheel
      run: |
        python -m pip install --upgrade pip
        pip install build setuptools wheel setuptools-scm[toml]
        python -m build --wheel

    - name: Create Release with wheels
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*.whl
        draft: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-deployment:
    name: Notify deployment status
    runs-on: ubuntu-latest
    needs: [publish-to-s3]
    if: always()

    steps:
    - name: Deployment Summary
      run: |
        echo "╔════════════════════════════════════════════════════════════╗"
        echo "║           📦 WHEEL DEPLOYMENT SUMMARY                      ║"
        echo "╚════════════════════════════════════════════════════════════╝"
        echo ""
        echo "Status: ${{ needs.publish-to-s3.result }}"
        echo ""
        if [ "${{ needs.publish-to-s3.result }}" = "success" ]; then
          echo "✅ Wheel successfully uploaded to S3"
          echo ""
          echo "Available for:"
          echo "  • Databricks: Install via pip from S3 URL"
          echo "  • AWS Lambda: Add as layer from S3"
          echo "  • AWS Glue: Add as Python package from S3"
        else
          echo "⚠️  S3 upload skipped (AWS credentials may not be configured)"
          echo ""
          echo "Wheel files are available as GitHub workflow artifacts"
          echo "Download and upload manually to your S3 bucket"
        fi
        echo ""
